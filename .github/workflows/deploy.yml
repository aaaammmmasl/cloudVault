name: Deploy CloudVault

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::957905603343:role/CloudVault-GitHub-Actions-Role
          aws-region: eu-north-1

      - name: Deploy to EC2
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-034f9bf3b00f1931a \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e; cd /opt/cloudvault/cloudVault; git pull origin main; sudo docker compose -f docker-compose.prod.yml up -d --build"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          STATUS="Pending"

          for i in {1..120}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-034f9bf3b00f1931a" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
              Pending|InProgress|Delayed|"")
                sleep 5
                ;;
              *)
                echo "Unknown SSM status: $STATUS"
                exit 1
                ;;
            esac
          done

          echo "----- Deployment output -----"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-034f9bf3b00f1931a" \
            --query "{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output yaml

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed."
            exit 1
          fi

          echo "Deployment succeeded."
